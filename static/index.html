<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Italpiel - Tienda de cueros</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="encabezado">
        <h1><a href="/">Italpiel S.A.</a></h1>
        <nav>
            <a href="#cueros">Cueros</a>
            <a href="#productos">Productos terminados</a>
            <a href="about.html">Sobre nosotros</a>
        </nav>
    </header>

    <main class="contenedor">

        <!-- ===================== CUEROS ===================== -->
        <section id="cueros" class="seccion">
            <h2>Cueros</h2>

            <div class="seccion-grid">
                <form id="form-cuero" class="formulario">
                    <h3>Nuevo cuero</h3>

                    <label>Nombre
                        <input type="text" name="nombre" required>
                    </label>
                    <label>Tipo
                        <input type="text" name="tipo" placeholder="Vacuno, ovino..." required>
                    </label>
                    <label>Acabado
                        <input type="text" name="acabado" placeholder="Graso, curtido vegetal...">
                    </label>
                    <label>Color
                        <input type="text" name="color">
                    </label>
                    <label>Espesor (mm)
                        <input type="number" name="espesor_mm" step="0.1" min="0.1" required>
                    </label>
                    <label>Precio ($)
                        <input type="number" name="precio" step="1" min="1" required>
                    </label>
                    <label>Descripción
                        <textarea name="descripcion" rows="3"></textarea>
                    </label>
                    <label>Imágenes
                        <input type="file" name="imagenes" accept="image/jpeg,image/png,image/webp" multiple>
                    </label>

                    <p class="mensaje-error" hidden></p>
                    <button type="submit">Agregar cuero</button>
                </form>

                <!-- app.js llena este contenedor con una tarjeta por cuero -->
                <div id="lista-cueros" class="lista-tarjetas" aria-live="polite"></div>
            </div>
        </section>

        <!-- ================ PRODUCTOS TERMINADOS ================ -->
        <section id="productos" class="seccion">
            <h2>Productos terminados</h2>

            <div class="seccion-grid">
                <form id="form-producto" class="formulario">
                    <h3>Nuevo producto</h3>

                    <label>Nombre
                        <input type="text" name="nombre" required>
                    </label>
                    <label>Categoría
                        <input type="text" name="categoria" placeholder="Alfombras, bajo monturas...">
                    </label>
                    <label>Color
                        <input type="text" name="color">
                    </label>
                    <label>Precio ($)
                        <input type="number" name="precio" step="1" min="1" required>
                    </label>
                    <label>Descripción
                        <textarea name="descripcion" rows="3"></textarea>
                    </label>
                    <label>Imágenes
                        <input type="file" name="imagenes" accept="image/jpeg,image/png,image/webp" multiple>
                    </label>

                    <p class="mensaje-error" hidden></p>
                    <button type="submit">Agregar producto</button>
                </form>

                <!-- app.js llena este contenedor con una tarjeta por producto -->
                <div id="lista-productos" class="lista-tarjetas" aria-live="polite"></div>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
